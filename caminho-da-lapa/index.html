<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Caminho da Lapa — Guia do Romeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
 :root{
  --sand:#1B1712;
  --sand-2:#24201A;
  --ink:#F3EDE3;
  --ink-soft:#B4A997;
  --river:#1E5F74;
  --river-deep:#0F3540;
  --gold:#C89B3C;
  --gold-soft:#DDBB6E;
  --clay:#A64A2A;
  --white:#241F19;
  --line:#3A3226;
  --radius:18px;
  --shadow: 0 10px 30px -14px rgba(43,38,32,.35);
  --shadow-lg: 0 20px 46px -18px rgba(15,53,64,.42);
  --font-display:'Fraunces', serif;
  --font-body:'Work Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
 }
 [data-theme="dark"]{
  --sand:#1B1712;
  --sand-2:#24201A;
  --ink:#F3EDE3;
  --ink-soft:#B4A997;
  --white:#241F19;
  --line:#3A3226;
  --shadow: 0 10px 30px -14px rgba(0,0,0,.55);
  --shadow-lg: 0 20px 46px -18px rgba(0,0,0,.6);
 }
 [data-largetext]{ --scale: 1.18; }
 *{box-sizing:border-box; margin:0; padding:0;}
 html,body{background:var(--sand); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
 body{transition:background .3s, color .3s;}
 body{font-size:calc(15px * var(--scale, 1)); line-height:1.5;}
 #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--sand);
  background-image:repeating-linear-gradient(135deg, rgba(43,38,32,.025) 0 1px, transparent 1px 26px);
  position:relative; overflow-x:hidden; box-shadow:0 0 60px rgba(0,0,0,.08);}
 h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
 button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
 a{color:inherit; text-decoration:none;}
 img{display:block;}
 svg{display:block;}
 :focus-visible{outline:2.5px solid var(--river); outline-offset:2px;}

 /* ---- top bar ---- */
 .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--sand); border-bottom:1px solid var(--line);}
 .brand{display:flex; align-items:center; gap:9px;}
 .brand-mark{width:32px; height:32px; border-radius:50%; background:#fff; flex:none; box-shadow:0 2px 6px rgba(166,74,42,.35); display:flex; align-items:center; justify-content:center; color:#fff; overflow:hidden;}
 .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
 .brand-name{font-family:var(--font-display); font-size:1.05rem; font-weight:600;}
 .icon-btn{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--sand-2); color:var(--ink); transition:.15s;}
 .icon-btn:active{transform:scale(.92);}
 .icon-btn.on{background:var(--river); color:#fff;}
 .icon-btn.sos-btn{background:#D62828; color:#fff; box-shadow:0 3px 10px -4px rgba(214,40,40,.6);}
 .icon-btn.sos-btn:active{transform:scale(.92);}
 .icon-btn{position:relative;}
 .admin-report-badge{position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:#D62828; color:#fff; font-size:.62rem; font-weight:700; display:none; align-items:center; justify-content:center; line-height:1;}
 .admin-report-badge.on{display:flex;}

 /* ---- screens ---- */
 .screen{display:none; padding:0 0 100px;}
 .screen.active{display:block; animation:fadein .35s ease;}
 .screen-pad{padding:22px 20px 0;}
 @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

 /* ---- welcome screen: fundo em degradê suave com as cores do app ---- */
 #q0{position:relative; z-index:0; isolation:isolate;}
 #q0::after{
  content:"";
  position:absolute; z-index:-1;
  top:250px; left:-15%; right:-15%; bottom:0;
  background-image:
   radial-gradient(60% 55% at 88% 8%, var(--gold-soft) 0%, transparent 68%),
   radial-gradient(70% 60% at 8% 30%, var(--river) 0%, transparent 70%),
   linear-gradient(160deg, var(--clay) 0%, transparent 55%);
  opacity:.12;
  pointer-events:none;
 }
 [data-theme="dark"] #q0::after{ opacity:.18; }

 /* ---- welcome hero (real photo, com leve movimento) ---- */
 .welcome-hero{position:relative; height:330px; background-size:118% auto; background-position:50% 50%; display:flex; align-items:flex-end; padding:24px 20px; overflow:hidden; animation:heroDrift 22s ease-in-out infinite alternate;}
 @keyframes heroDrift{
  0%{background-size:118% auto; background-position:50% 42%;}
  100%{background-size:132% auto; background-position:56% 58%;}
 }
 @media (prefers-reduced-motion: reduce){ .welcome-hero{animation:none;} }
 .welcome-hero-content{position:relative; color:#fff;}
 .welcome-eyebrow{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
 .welcome-hero h1{font-size:2.15rem; color:#fff; line-height:1.1;}
 .welcome-hero p{color:rgba(255,253,249,.88); font-size:.87rem; margin-top:9px; max-width:320px; line-height:1.5;}

 /* ---- welcome: highlight strip ---- */
 .welcome-highlights{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:-38px 0 24px; position:relative; z-index:2;}
 .wh-card{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:var(--shadow);}
 .wh-ic{width:30px; height:30px; margin:0 auto 6px; border-radius:9px; background:var(--sand-2); color:var(--river); display:flex; align-items:center; justify-content:center;}
 .wh-label{font-size:.68rem; font-weight:600; color:var(--ink); line-height:1.25;}

 /* ---- welcome: feature list ---- */
 .welcome-lead{color:var(--ink-soft); font-size:.92rem; line-height:1.5; margin-bottom:22px;}
 .wf-card{display:flex; gap:12px; align-items:flex-start; padding:14px; background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);}
 .wf-ic{width:38px; height:38px; border-radius:10px; background:var(--sand-2); color:var(--river); display:flex; align-items:center; justify-content:center; flex:none;}
 .wf-title{font-weight:600; font-size:.9rem; margin-bottom:2px;}
 .wf-sub{font-size:.78rem; color:var(--ink-soft); line-height:1.4;}
 .welcome-note{text-align:center; font-size:.72rem; color:var(--ink-soft); font-family:var(--font-mono); margin-top:12px; letter-spacing:.02em;}

 /* ---- pilgrim stamp signature ---- */
 .stamp{position:absolute; width:84px; height:84px; border-radius:50%; border:1.5px solid rgba(255,253,249,.75);
  display:flex; align-items:center; justify-content:center; transform:rotate(-11deg); pointer-events:none;}
 .stamp::before{content:""; position:absolute; inset:6px; border:1px dashed rgba(255,253,249,.55); border-radius:50%;}
 .stamp-text{font-family:var(--font-mono); font-size:.52rem; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,253,249,.92); text-align:center; line-height:1.5;}
 .stamp-top{top:20px; right:18px;}
 .stamp.on-card{border-color:rgba(255,253,249,.5); position:absolute; top:16px; right:16px;}

 /* ---- wizard ---- */
 .progress-row{display:flex; gap:6px; margin-bottom:26px;}
 .progress-seg{flex:1; height:4px; border-radius:2px; background:var(--line);}
 .progress-seg.done{background:var(--river);}
 .eyebrow{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--river); margin-bottom:10px;}
 [data-theme="dark"] .eyebrow{color:var(--gold-soft);}
 .q-title{font-size:1.5rem; line-height:1.25; margin-bottom:6px;}
 .q-sub{color:var(--ink-soft); margin-bottom:24px; font-size:.92rem;}
 .options{display:grid; gap:10px;}
 .opt{display:flex; align-items:center; gap:12px; padding:16px; border:1.5px solid var(--line); border-radius:14px; background:var(--white); transition:.15s; text-align:left; font-size:.98rem; font-weight:500;}
 .opt:active{transform:scale(.98);}
 .opt.selected{border-color:var(--river); background:color-mix(in srgb, var(--river) 8%, var(--white)); box-shadow:0 0 0 1px var(--river) inset;}
 .opt .opt-ic{width:34px; height:34px; border-radius:10px; background:var(--sand-2); display:flex; align-items:center; justify-content:center; flex:none; color:var(--river);}
 .opt.selected .opt-ic{background:var(--river); color:#fff;}
 .options.two-col{grid-template-columns:1fr 1fr;}
 .nav-row{display:flex; gap:10px; margin-top:28px;}
 .btn{padding:15px 22px; border-radius:14px; font-weight:600; font-size:.98rem; flex:1; text-align:center; transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px;}
 .btn:active{transform:scale(.98);}
 .btn-primary{background:var(--river); color:#fff; box-shadow:0 8px 20px -8px rgba(30,95,116,.55);}
 .btn-primary:disabled{opacity:.4; box-shadow:none;}
 .btn-ghost{background:var(--sand-2); color:var(--ink);}
 .btn-google{width:100%; background:var(--white); color:var(--ink); border:1px solid var(--line); box-shadow:0 2px 6px rgba(0,0,0,.06);}
 .auth-divider{display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--ink-soft); font-size:.8rem;}
 .auth-divider::before, .auth-divider::after{content:""; flex:1; height:1px; background:var(--line);}

 /* ---- itinerary ---- */
 .hero-summary{background:linear-gradient(150deg, rgba(15,53,64,.95), rgba(30,95,116,.86)), var(--cover-url); background-size:cover, 130% auto; background-position:center, 50% 50%; color:#fff; border-radius:22px; padding:24px; margin:0 20px 22px; position:relative; overflow:hidden; box-shadow:var(--shadow-lg); animation:heroDrift2 24s ease-in-out infinite alternate;}
 @keyframes heroDrift2{
  0%{background-size:cover, 130% auto; background-position:center, 46% 40%;}
  100%{background-size:cover, 142% auto; background-position:center, 54% 60%;}
 }
 @media (prefers-reduced-motion: reduce){ .hero-summary{animation:none;} }
 .hero-summary h2{font-size:1.35rem; margin-bottom:4px; position:relative;}
 .hero-summary p{opacity:.88; font-size:.85rem; position:relative; line-height:1.5; max-width:78%;}
 .hero-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; position:relative;}
 .hero-tag{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24); padding:5px 11px; border-radius:100px; font-size:.72rem; font-family:var(--font-mono); backdrop-filter:blur(4px);}

 .day-tabs{display:flex; gap:8px; overflow-x:auto; margin:0 20px 20px; padding-bottom:4px;}
 .day-tab{flex:none; padding:9px 16px; border-radius:100px; background:var(--sand-2); font-weight:600; font-size:.85rem; white-space:nowrap; border:1.5px solid transparent;}
 .day-tab.active{background:var(--ink); color:var(--sand); }
 [data-theme="dark"] .day-tab.active{background:var(--gold); color:#1B1712;}

 .trail{position:relative; padding:0 20px 0 54px;}
 .trail::before{content:""; position:absolute; left:31px; top:6px; bottom:6px; width:2px; background:repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 12px);}
 .stop{position:relative; margin-bottom:18px;}
 .bead{position:absolute; left:-34px; top:2px; width:24px; height:24px; border-radius:50%; background:var(--white); border:2.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:.65rem; font-family:var(--font-mono); font-weight:600; color:var(--river-deep); box-shadow:var(--shadow);}
 .stop-card{background:var(--white); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);}
 .stop-photo{height:150px; background-size:cover; background-position:center; position:relative;}
 .stop-time{position:absolute; top:11px; left:11px; background:rgba(15,12,8,.55); color:#fff; font-family:var(--font-mono); font-size:.72rem; padding:5px 10px; border-radius:100px; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.18);}
 .stop-cat{position:absolute; top:11px; right:11px; background:rgba(255,253,249,.92); color:var(--river-deep); font-size:.68rem; font-weight:700; padding:5px 10px; border-radius:100px; backdrop-filter:blur(6px);}
 .stop-body{padding:15px 16px 16px;}
 .stop-name{font-family:var(--font-display); font-size:1.12rem; font-weight:600; margin-bottom:3px;}
 .stop-meta{display:flex; gap:12px; color:var(--ink-soft); font-size:.78rem; margin-bottom:10px; font-family:var(--font-mono); align-items:center;}
 .stop-meta span{display:flex; align-items:center; gap:4px;}
 .stop-desc{font-size:.86rem; color:var(--ink-soft); margin-bottom:12px; line-height:1.5; display:flex; gap:8px; align-items:flex-start;}
 .stop-desc-text{flex:1;}
 .speak-btn{width:26px; height:26px; border-radius:50%; background:var(--sand-2); color:var(--river); display:flex; align-items:center; justify-content:center; flex:none; transition:.15s;}
 [data-theme="dark"] .speak-btn{color:var(--gold-soft);}
 .speak-btn:active{transform:scale(.9);}
 .speak-btn.active{background:var(--river); color:#fff;}
 [data-theme="dark"] .speak-btn.active{background:var(--gold); color:#1B1712;}
 .stop-actions{display:flex; gap:8px;}
 .chip-btn{flex:1; padding:11px; border-radius:11px; background:var(--sand-2); font-size:.78rem; font-weight:600; text-align:center; display:flex; align-items:center; justify-content:center; gap:5px; transition:.15s;}
 .chip-btn:active{transform:scale(.96);}
 .chip-btn.primary{background:var(--river); color:#fff;}
 .chip-btn.fav{width:44px; flex:none;}
 .chip-btn.fav.active{color:var(--clay); background:color-mix(in srgb, var(--clay) 14%, var(--sand-2));}
 .chip-btn.fav svg{fill:none;}
 .chip-btn.fav.active svg{fill:currentColor;}

 .details-panel{max-height:0; overflow:hidden; transition:max-height .35s ease;}
 .details-panel.open{max-height:600px; border-top:1px dashed var(--line); margin-top:12px;}
 .details-inner{padding-top:12px; font-size:.84rem; color:var(--ink-soft); display:grid; gap:8px;}
 .details-inner b{color:var(--ink);}

 .itin-actions{display:flex; gap:8px; margin:0 20px 18px;}
 .itin-actions .chip-btn.on{background:var(--river); color:#fff;}
 .weather-strip{display:flex; align-items:center; gap:12px; background:var(--sand-2); border-radius:14px; padding:12px 14px; margin:0 20px 18px;}
 .weather-strip .w-ic{width:34px; height:34px; border-radius:50%; background:var(--white); display:flex; align-items:center; justify-content:center; color:var(--gold); flex:none;}

 .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--white); border-top:1px solid var(--line); display:flex; padding:8px 6px 12px; z-index:50;}
 .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.66rem; color:var(--ink-soft); font-weight:600; padding:6px 0; border-radius:10px;}
 .nav-item.active{color:var(--river);}
 [data-theme="dark"] .nav-item.active{color:var(--gold);}

 .section-title{font-size:1.1rem; margin:22px 0 12px; display:flex; align-items:center; gap:8px;}
 .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
 .info-card{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; transition:.15s;}
 .info-card:active{transform:scale(.97);}
 .info-card.active-tab{border-color:var(--river); background:color-mix(in srgb, var(--river) 8%, var(--white));}
 .info-card .ic-wrap{width:30px; height:30px; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; color:var(--river);}
 .info-card .lbl{font-size:.72rem; color:var(--ink-soft); font-weight:600;}

 .a11y-row{display:flex; gap:10px; margin-bottom:16px;}
 .a11y-btn{flex:1; padding:10px; border-radius:12px; background:var(--sand-2); font-size:.72rem; font-weight:600; text-align:center;}
 .a11y-btn.active{background:var(--river); color:#fff;}

 .list-card{display:flex; gap:12px; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; align-items:center; box-shadow:var(--shadow);}
 .list-card .thumb{width:64px; height:64px; border-radius:12px; background-size:cover; background-position:center; flex:none; display:flex; align-items:center; justify-content:center; color:var(--river); background-color:var(--sand-2); position:relative;}
 .list-card .body{flex:1; min-width:0;}
 .list-card .name{font-weight:600; font-size:.92rem; margin-bottom:2px;}
 .list-card .sub{font-size:.75rem; color:var(--ink-soft);}
 .list-card .go{width:38px; height:38px; border-radius:10px; background:var(--sand-2); display:flex; align-items:center; justify-content:center; color:var(--river); flex:none;}

 /* ---- alerta de risco (pulsante) ---- */
 @keyframes dangerPulse{
  0%{box-shadow:0 0 0 0 rgba(214,40,40,.55);}
  70%{box-shadow:0 0 0 9px rgba(214,40,40,0);}
  100%{box-shadow:0 0 0 0 rgba(214,40,40,0);}
 }
 @keyframes dangerBlink{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
 .danger-chip{display:inline-flex; align-items:center; gap:5px; margin-top:8px; padding:4px 10px 4px 8px; border-radius:20px; background:#D62828; color:#fff; font-size:.66rem; font-weight:700; letter-spacing:.01em; text-transform:uppercase; animation:dangerPulse 1.8s infinite;}
 .danger-chip svg{animation:dangerBlink 1.4s infinite;}
 .danger-thumb-badge{position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:50%; background:#D62828; color:#fff; display:flex; align-items:center; justify-content:center; animation:dangerPulse 1.8s infinite;}
 .modal-danger-icon{width:52px; height:52px; border-radius:50%; background:#D62828; color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
 .modal-danger-title{color:#D62828;}

 /* ---- formulário de parcerias ---- */
 .form-field{margin-bottom:12px;}
 .form-field label{display:block; font-size:.76rem; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
 .form-field input, .form-field select, .form-field textarea{width:100%; padding:11px 12px; border-radius:11px; border:1.5px solid var(--line); background:var(--sand-2); color:var(--ink); font-family:inherit; font-size:.88rem;}
 .form-field textarea{min-height:70px; resize:vertical;}
 .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:none; border-color:var(--river);}

 /* ---- explore sub tabs ---- */
 .subtabs{display:flex; gap:6px; overflow-x:auto; margin:14px 0 16px; padding-bottom:2px;}
 .subtab{flex:none; padding:8px 14px; border-radius:100px; font-size:.78rem; font-weight:600; font-family:var(--font-mono); color:var(--ink-soft); background:var(--sand-2); border:1px solid transparent;}
 .subtab.active{background:var(--river); color:#fff;}

 /* ================= FLOATING AI BUTTON ================= */
 .fab{position:absolute; right:16px; bottom:24px; height:52px; padding:0 18px 0 16px; border-radius:100px;
  background:linear-gradient(150deg, var(--gold-soft), var(--clay)); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 12px 26px -8px rgba(166,74,42,.55); z-index:45; transition:transform .2s ease, bottom .2s ease; max-width:calc(100% - 32px);}
 .fab.with-nav{bottom:96px;}
 .fab-label{font-size:.85rem; font-weight:600; white-space:nowrap;}
 .fab:active{transform:scale(.95);}
 .fab::after{content:""; position:absolute; inset:-5px; border-radius:100px; border:1.5px solid var(--gold-soft); opacity:.55; animation:pulse-ring 2.4s ease-out infinite;}
 @keyframes pulse-ring{0%{transform:scale(.85); opacity:.6;} 100%{transform:scale(1.28); opacity:0;}}

 /* ================= CHAT / AI ASSISTANT PANEL ================= */
 .chat-overlay{position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; height:100%; z-index:60; pointer-events:none;}
 .chat-overlay.open{pointer-events:auto;}
 .chat-backdrop{position:absolute; inset:0; background:rgba(15,12,8,.45); opacity:0; transition:opacity .3
